name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install release-please
        run: npm install --no-save --no-package-lock release-please@17.11.2
      # run with a custom versioning strategy (perf commits bump the minor version), see the script for details
      - name: Run release-please
        id: release
        run: node .github/scripts/release-please.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
